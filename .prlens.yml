# PRLens repository configuration (example).
# Everything here is optional; these are the defaults made explicit.

categories: [bug, security, correctness, performance]
max_comments: 5
min_confidence: 0.7

exclude:
  - "tests/fixtures/**"
  - "docs/**"
  - "evaluation/benchmark/**"

# Teach the reviewer this repository's conventions. This text is composed into the
# system prompt as maintainer guidance.
instructions: |
  This project values precision over coverage. Prefer silence.
  Flag concrete defects only: logic errors, security issues, resource leaks,
  incorrect error handling. Do not comment on style, naming, or formatting.
