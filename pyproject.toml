[project]
name = "prlens"
version = "0.1.0"
description = "AI code review that only comments when it has something worth saying"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "PRLens contributors" }]
keywords = ["github", "code-review", "llm", "github-action", "pull-request"]
dependencies = [
    "requests>=2.31",
    "pydantic>=2.6",
    "unidiff>=0.7.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.5",
]
mining = [
    "tqdm>=4.66",
]
finetune = [
    "transformers>=4.40",
    "peft>=0.11",
    "bitsandbytes>=0.43",
    "datasets>=2.19",
    "accelerate>=0.30",
    "trl>=0.9",
]

[project.scripts]
prlens = "prlens.cli:main"

[project.urls]
Homepage = "https://github.com/Ahmad6564/PR_Review_agent"
Issues = "https://github.com/Ahmad6564/PR_Review_agent/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "prlens",
    "prlens.llm",
    "prlens.github",
    "prlens.context",
    "prlens.agent",
    "prlens.filter",
]

[tool.setuptools.package-data]
"prlens.agent" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
